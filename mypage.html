<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YONA's World</title>

    <style>
        body {
            background-color: #fff0f6;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 60px;
        }

        h1 {
            color: #d63384;
            font-size: 50px;
        }

        p {
            color: #555;
            font-size: 20px;
        }

        .card {
            background-color: white;
            max-width: 600px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #a61e5c;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🌸 YONA's World 🌸</h1>

        <p>こんにちは！</p>

        <p>歡迎來到我的網站！</p>

        <p>🎨 我喜歡畫畫</p>
        <p>🌷 我喜歡出去玩</p>
        <p>✨ 這是我的第一個作品網站</p>

        <button onclick="alert('歡迎來到 YONA 的網站！')">
            點我！
        </button>

    </div>

</body>

</html>
